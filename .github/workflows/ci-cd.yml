name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -q

      - uses: hashicorp/setup-terraform@v4

      - name: Check Terraform
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Build Docker image
        run: docker build -t mnist-cloud-devops:test .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          docker build \
            -t ghcr.io/sinaac02/mnist-cloud-devops:${{ github.sha }} \
            -t ghcr.io/sinaac02/mnist-cloud-devops:latest .
          docker push ghcr.io/sinaac02/mnist-cloud-devops:${{ github.sha }}
          docker push ghcr.io/sinaac02/mnist-cloud-devops:latest

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to Azure VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/sinaac02/mnist-cloud-devops:${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VM_USER@$VM_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$VM_USER@$VM_HOST" "cd ~/mnist-cloud-devops && git pull --ff-only && APP_IMAGE='$IMAGE' docker compose pull app && APP_IMAGE='$IMAGE' docker compose up -d --no-build"
          ssh "$VM_USER@$VM_HOST" "curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 http://localhost/health"

      - name: Remove registry login from VM
        if: always()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh "$VM_USER@$VM_HOST" "docker logout ghcr.io"
